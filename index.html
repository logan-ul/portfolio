<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logan UL - Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="script" href="gallery.js" />
  </head>
  <body>
    <nav>
      <div class="header">
        <div class="header-content">
          <h1 id="name-header">Logan UL</h1>
          <p id="title-header">Web Developer</p>
        </div>
      </div>
    </nav>
    <main>
      <div class="hero curved-box">
        <div class="hero-image-box">
          <img
            src="static/web-development-svgrepo-com.svg"
            alt="Web Development"
            style="filter: invert(1); height: 100%; width: 100%"
          />
        </div>

        <div class="hero-content">
          <h1>Real Human Websites.</h1>
          <div class="options" style="flex-direction: row">
            <a href="" class="button">View Projects</a>
            <a href="" class="button">About Me</a>
          </div>
        </div>
      </div>
      <div class="examples">
        <h2 id="example-header">Examples</h2>
        <div class="color-wrapper">
          <div class="pictures">
            <div class="img-box"></div>
          </div>
        </div>

        <div class="options">
          <div id="upper-buttons">
            <button
              id="previous-btn"
              onclick="move_image(false)"
              class="button"
            >
              Previous
            </button>
            <button id="next-btn" onclick="move_image(true)" class="button">
              Next
            </button>
          </div>
          <div id="lower-buttons">
            <a id="details-btn" class="button" style="text-wrap: nowrap" href=""
              >See more about this example</a
            >
          </div>
        </div>
      </div>
      <div style="height: 2000px"></div>
    </main>
    <script type="module" src="gallery.js">
      import { move_image, update_images, GalleryImage } from "./gallery.js";
      let image1 = new GalleryImage(
          "duck-system",
          "static/Duck-System-Example.png",
          document.createElement("img"),
        );
      let image2 = new GalleryImage(
        "task-assessment",
        "static/Task-Assessment-Example.png",
        document.createElement("img"),
      );
      let image3 = new GalleryImage(
        "vietnam",
        "static/Vietnam-Example.png",
        document.createElement("img"),
      );

      let imageCollection = [image1, image2, image3];
      let container = document.querySelector(".img-box");
      let detailsButton = document.querySelector("#details-btn");
      main(imageCollection, container, detailsButton);
    </script>
  </body>
</html>
