<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logan UL - Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay hidden">
      <div class="overlay-content">
        <img src="" alt="" class="overlay-image curved-box" />
      </div>
    </div>
    <nav>
      <div class="nav-header">
        <div class="nav-header-content">
          <h1 id="name-header">Logan UL</h1>
          <p id="title-header">Web Developer</p>
      </div>
      </div>
      <div class="nav-links">
        <div class="dropdown">
          <div class="dropdown-header">
            <h4>Web Projects</h4>
          </div>
          <div class="dropdown-options">
            <a href="duck-system.html" class="nav-link">Duck System</a>
            <a href="task-assessment.html" class="nav-link">Task Assessment</a>
            <a href="duck-system.html" class="nav-link">Vietnam School Project</a>
          </div>
        </div>
        <div class="dropdown">
          <div class="dropdown-header">
            <h4><a href="">Other Projects</a></h4>
          </div>
        </div>
        <div class="dropdown">
          <div class="dropdown-header">
            <h4><a href="extras.html">Extras</a></h4>
          </div>
        </div>
        <div class="dropdown">
          <div class="dropdown-header">
            <h4><a href="extras.html">Certifications</a></h4>
          </div>
        </div>
        <div class="dropdown">
          <div class="dropdown-header">
            <h4><a href="extras.html">About Me</a></h4>
          </div>
        </div>

    </nav>
    <main>
      <div class="hero curved-box">
        <div class="hero-image-box">
          <img
            src="static/web-development-svgrepo-com.svg"
            alt="Web Development"
            style="filter: invert(1); height: 100%; width: 100%"
          />
        </div>

        <div class="hero-content">
          <h1>Real Human Websites.</h1>
          <div class="options" style="flex-direction: row">
            <a href="" class="button">View Projects</a>
            <a href="" class="button">About Me</a>
          </div>
        </div>
      </div>
      <div class="gallery">
        <h2 id="example-header">Examples</h2>
        <div class="color-wrapper">
          <div class="pictures">
            <div class="img-box"></div>
          </div>
        </div>

        <div class="options">
          <div id="upper-buttons">
            <button id="previous-btn" class="button move-button">
              Previous
            </button>
            <button id="next-btn" class="button move-button">Next</button>
          </div>
          <div id="lower-buttons">
            <a id="details-btn" class="button" style="text-wrap: nowrap" href=""
              >See more about this example</a
            >
          </div>
        </div>
      </div>
      <div style="height: 2000px"></div>
    </main>
    <script src="gallery.js"></script>
    <script defer>
      let image1 = new GalleryImage(
        "duck-system",
        "static/Duck-System-Example.png",
        document.createElement("img"),
      );
      let image2 = new GalleryImage(
        "task-assessment",
        "static/Task-Assessment-Example.png",
        document.createElement("img"),
      );
      let image3 = new GalleryImage(
        "vietnam",
        "static/Vietnam-Example.png",
        document.createElement("img"),
      );

      const buttons = document.querySelectorAll(".move-button");
      const imageCollection = [image1, image2, image3];
      const container = document.querySelector(".img-box");
      const detailsButton = document.querySelector("#details-btn");
      const overlay = document.querySelector(".overlay");
      const overlayImage = document.querySelector(".overlay-image");

      overlayImage.addEventListener("click", () => {
        if (!overlay.classList.contains(".hidden")) {
          overlay.classList.add("hidden");
        }
      });

      buttons.forEach((button) => {
        if (button.id === "previous-btn") {
          button.addEventListener("click", () => {
            moveImage(false, container, imageCollection, detailsButton);
          });
        } else if (button.id === "next-btn") {
          button.addEventListener("click", () => {
            moveImage(true, container, imageCollection, detailsButton);
          });
        }
      });

      main(imageCollection, container, detailsButton, true);
    </script>
  </body>
</html>
