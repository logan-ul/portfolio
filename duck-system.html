<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logan UL - Portfolio</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body>
    <nav>
      <div class="header">
        <div class="header-content">
          <h1 id="name-header">Logan UL</h1>
          <p id="title-header">Web Developer</p>
        </div>
      </div>
    </nav>
    <main>
      <div class="duck-system gallery">
        <div class="color-wrapper">
          <div class="pictures">
            <div class="img-box"></div>
          </div>
        </div>
        <div class="options">
          <div id="upper-buttons">
            <button id="previous-btn" class="button move-button">Previous</button>
            <button id="next-btn" class="button move-button">Next</button>
          </div>
        </div>
      </div>
      <div style="height: 2000px;"></div>
      </div>
    </main>
  </body>
  <script src="gallery.js"></script>
    <script defer>
      let image1 = new GalleryImage(
        "duck-system-admin",
        "static/Duck-System-Example.png",
        document.createElement("img"),
      );
      let image2 = new GalleryImage(
        "duck-system-form",
        "static/Duck-System-Form.png",
        document.createElement("img"),
      );
      let image3 = new GalleryImage(
        "duck-system-docs",
        "static/Duck-System-Docs.png",
        document.createElement("img"),
      );

      const buttons = document.querySelectorAll(".move-button");
      const imageCollection = [image1, image2, image3];
      const container = document.querySelector(".img-box");
      const detailsButton = document.querySelector("#details-btn");

      buttons.forEach((button) => {
        if (button.id === "previous-btn") {
          button.addEventListener("click", () => {
            move_image(false, container, imageCollection, detailsButton);
          });
        } else if (button.id === "next-btn") {
          button.addEventListener("click", () => {
            move_image(true, container, imageCollection, detailsButton);
          });
        }
      });

      main(imageCollection, container, detailsButton);
    </script>
</html>
